# 生产环境配置: 与 application.yml 合并, 覆盖其中的敏感/开发项
# 敏感值一律走环境变量, 不落盘明文:
#   DB_PASSWORD       数据库密码
#   JWT_SECRET        JWT 签名密钥(openssl rand -base64 48 生成, >=32 字节)
#   OJ_TESTDATA_DIR   测试点数据目录(默认 /opt/oj/oj-testdata)
#   REDIS_HOST        Redis 地址(默认 localhost, 评测机扩容到其他机器时改)

spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/oj?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: oj
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

mybatis-plus:
  configuration:
    # 生产环境不打印 SQL
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

oj:
  testdata:
    # 绝对路径: Web 与评测机进程都必须能读到同一份测试点数据
    dir: ${OJ_TESTDATA_DIR:/opt/oj/oj-testdata}
  jwt:
    secret: ${JWT_SECRET}
    expire-hours: 168
